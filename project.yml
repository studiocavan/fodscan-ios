name: FodScan
options:
  bundleIdPrefix: com.studiocavan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  FodScan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FodScan
    info:
      path: FodScan/Info.plist
      properties:
        CFBundleDisplayName: "FodScan"
        NSCameraUsageDescription: "Scan product barcodes and ingredient labels"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        SWIFT_VERSION: "5.10"
        PRODUCT_BUNDLE_IDENTIFIER: com.studiocavan.fodscan
        PRODUCT_NAME: FodScan
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FodScanTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    dependencies:
      - target: FodScan
    settings:
      base:
        SWIFT_VERSION: "5.10"
